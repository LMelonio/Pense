# Confere os tipos e roda os testes a cada push e pull request: regras do app (src/domain/regras.test.ts), regras do
# banco num Postgres local (banco.test.ts, com PGlite) e a paridade app × banco (paridade.test.ts).
# Não depende do Supabase nem de secrets.
name: Testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save @electric-sql/pglite@0.2.17
      - run: npm run typecheck
      - run: npm test
