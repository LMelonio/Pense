# Testa as regras do banco (migrations e funções) num Postgres local a cada push e pull request.
# Não depende do Supabase nem de secrets.
name: Testes do banco

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  banco:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm install --no-save @electric-sql/pglite@0.2.17
      - run: node scripts/testar-banco.mjs
